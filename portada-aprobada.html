es explorar" value="Playa Chileno, Baja California Sur" required><input class="radio free" type="radio" name="mode" value="libre" aria-label="Exploración libre" checked><input class="radio history" type="radio" name="mode" value="historia" aria-label="Expedición histórica"><input class="radio science" type="radio" name="mode" value="ciencia" aria-label="Investigación científica"><button class="hotspot start" type="submit" aria-label="Comenzar mi exploración"></button></form><button class="hotspot person" style="left:14%" data-person="Diego" aria-label="Conocer a Diego"></button><button class="hotspot person" style="left:29%" data-person="Valeria" aria-label="Conocer a Valeria"></button><button class="hotspot person" style="left:44%" data-person="Humboldt" aria-label="Conocer a Alexander von Humboldt"></button><button class="hotspot person" style="left:59%" data-person="Mary Anning" aria-label="Conocer a Mary Anning"></button><button class="hotspot person" style="left:74%" data-person="Cochimí" aria-label="Conocer los pueblos cochimíes"></button><span class="notice" id="chosen" hidden></span></main></div><div class="dialog" id="dialog" hidden><article role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h2 id="dialogtitle"></h2><p id="dialogbody"></p><button id="pick">Elegir compañero</button> <button id="close" type="button">Cerrar</button></article></div><script>const sel=document.getElementById('continent');const place=document.getElementById('place');const dialog=document.getElementById('dialog');let selectedPerson='';const people={'Diego':'Personaje ficticio. Curioso, observador y siempre dispuesto a investigar lo que parece imposible.','Valeria':'Personaje ficticio. Viajera, fotógrafa y narradora. Le gusta descubrir historias a partir de los detalles.','Humboldt':'Alexander von Humboldt (1769–1859), naturalista y geógrafo que estudió las relaciones entre naturaleza, clima y territorio.','Mary Anning':'Mary Anning (1799–1847), pionera de la paleontología cuyos hallazgos fósiles transformaron el conocimiento de la vida antigua.','Cochimí':'Los pueblos cochimíes forman parte de la historia indígena de Baja California. Esta tarjeta representa una tradición cultural, no una persona histórica identificada.'};document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{sel.value=b.dataset.map;sel.focus()}));let pending='';document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>{pending=b.dataset.person;document.getElementById('dialogtitle').textContent=pending;document.getElementById('dialogbody').textContent=people[pending];dialog.hidden=false;document.getElementById('pick').focus()}));document.getElementById('pick').addEventListener('click',()=>{selectedPerson=pending;dialog.hidden=true;const chosen=document.getElementById('chosen');chosen.textContent='Compañero: '+selectedPerson;chosen.hidden=false});document.getElementById('close').addEventListener('click',()=>dialog.hidden=true);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')dialog.hidden=true});document.getElementById('explore').addEventListener('submit',e=>{e.preventDefault();if(!place.value.trim()){place.focus();return}const params=new URLSearchParams({continente:sel.value,lugar:place.value.trim(),tipo:document.querySelector('[name=mode]:checked').value,personaje:selectedPerson});location.href='experiencia.html?'+params.toString()});</script></body></html>
