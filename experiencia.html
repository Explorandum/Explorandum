<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorandum · Tu expedición</title><style>body{margin:0;background:#e8e5dc;color:#263a3a;font:18px/1.6 Georgia,serif}main{max-width:850px;margin:6vh auto;padding:35px;background:#fffdf7;box-shadow:0 8px 35px #0002;border-radius:12px}h1{font-size:clamp(30px,5vw,50px);margin:0}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font:700 12px system-ui;color:#54726b}.tag{display:inline-block;background:#e4ede6;padding:6px 12px;border-radius:30px;font:13px system-ui;margin:8px 6px 15px 0}a{color:#245a51}section{border-top:1px solid #cbd5cb;padding-top:18px;margin-top:25px}.choice{display:block;background:#f1f4ed;border:1px solid #aabfb1;border-radius:7px;padding:14px;margin:10px 0;text-decoration:none;color:#1b4642}button{padding:11px;border:1px solid #9baea2;border-radius:6px;background:#e5eee6;font:16px Georgia;cursor:pointer}textarea{width:100%;min-height:100px;font:16px Georgia;padding:10px;box-sizing:border-box}#feedback{color:#285b48}</style></head><body><main><p class="eyebrow">Explorandum · Cuaderno de campo</p><h1 id="title">Tu próxima exploración</h1><p id="intro"></p><div id="tags"></div><section><h2>Una pregunta para empezar</h2><p id="question"></p><div id="ideas"></div></section><section><h2>Mi cuaderno</h2><p>Anota una observación, una pregunta o algo que quieras investigar. Se guarda únicamente en este navegador.</p><textarea id="notes" placeholder="Me pregunto si…"></textarea><p><button id="save">Guardar mi nota</button> <span id="feedback" role="status"></span></p></section><section><a href="portada-nueva.html">← Volver a la habitación</a></section></main><script>const p=new URLSearchParams(location.search);const continent=p.get('continente')||'el mundo';const place=p.get('lugar')||'un lugar por descubrir';const mode=p.get('tipo')||'libre';const person=p.get('personaje')||'';document.querySelector('#title').textContent=place;document.querySelector('#intro').textContent='Has elegido explorar '+place+' ('+continent+'). Esta primera estación te ayuda a observar y formular preguntas. Todavía no genera automáticamente datos ni actividades específicos del lugar.';document.querySelector('#tags').textContent=[mode==='historia'?'Expedición histórica':mode==='ciencia'?'Investigación científica':'Exploración libre',person?'Con '+person:''].filter(Boolean).join(' · ');const prompts={libre:['¿Qué hay aquí que no esperarías encontrar en otro lugar?','Busca tres pistas distintas: una del paisaje, una de la vida y una de la actividad humana. ¿Qué preguntas te sugieren?'],historia:['¿Cómo podríamos averiguar quién vivía aquí hace cien o mil años?','Distingue una huella visible, un testimonio y una hipótesis. ¿Qué fuentes necesitarías para comprobarla?'],ciencia:['¿Qué fenómeno de este lugar podrías observar o medir?','Piensa en una observación repetible, qué variable cambiarías y qué resultado te haría cambiar de opinión.']};document.querySelector('#question').textContent=prompts[mode]?.[0]||prompts.libre[0];document.querySelector('#ideas').textContent=prompts[mode]?.[1]||prompts.libre[1];const key='explorandum-notes-'+continent+'-'+place;try{document.querySelector('#notes').value=localStorage.getItem(key)||''}catch(e){}document.querySelector('#save').onclick=()=>{try{localStorage.setItem(key,document.querySelector('#notes').value);document.querySelector('#feedback').textContent='Nota guardada.'}catch(e){document.querySelector('#feedback').textContent='No se ha podido guardar en este navegador.'}};</script></body></html>
