name: EXPLORANDUM - bosque de algas real
on:
  push:
    paths:
      - 'tools/preparar_bosque_algas.py'
      - '.github/workflows/preparar-bosque-algas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: FFmpeg autocontenido
        run: python3 -m pip install --break-system-packages -q imageio-ffmpeg
      - name: Generar secuencia de bosque de algas auténtico
        run: python3 tools/preparar_bosque_algas.py
      - name: Publicar MP4
        run: |
          set -euo pipefail
          test -s media/real/bosque-algas.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/real/bosque-algas.mp4
          git commit -m "Incorporar vídeo documental real de algas y peces"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
