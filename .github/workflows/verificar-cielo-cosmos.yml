name: EXPLORANDUM - comprobar cielo y cosmos
on:
  push:
    paths:
      - 'cielo-y-cosmos-baja-california.html'
      - '.github/workflows/verificar-cielo-cosmos.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar fuentes y fotos reales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('cielo-y-cosmos-baja-california.html').read_text()
          assert s.count('class="station"')==4
          assert 'Pelicans_in_flight.jpg' in s and 'Brown_pelican_' in s
          assert 'class="skyroute"' in s
          assert all(x in s for x in ['Guerrero Negro','GOES-18','San Pedro Mártir','seaTemp','lightPollution'])
          assert 'media/terrestre/golfo-nasa-satelite.jpg' not in s
          assert 'GOES-18%20GEOcolor-June-702022.png.webp' in s
          assert 'Misión 07' in s
          assert all(x in s for x in ['birdEvidence','wetlandChoice','weatherEvidence','saveFieldNotes','copyFieldNotes'])
          assert 'Observatorio_de_San_Pedro_Martir.jpg' in s and 'Cbojorquez75' in s
          assert 'pronatura-noroeste.org' in s and 'trackingEvidence' in s
          assert 'Beautiful_Clouds_off_of_Baja_California' in s
          assert 'id="mapa-migratorio"' in s and 'id="migrationPath"' in s
          assert 'siteData' in s and 'mapFieldNote' in s
          assert 'science.nasa.gov' in s and 'id="skyQuestion"' in s
          print('PASS: cuatro estaciones, aves distintas, NASA unica, cuaderno propio')
          PY
      - name: Navegador movil y escritorio
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/cosmos.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          for(const v of [{width:1440,height:900},{width:390,height:844}]){
            const p=await b.newPage({viewport:v});
            const err=[];p.on('pageerror',e=>err.push(e.message));
            await p.goto('http://127.0.0.1:8765/cielo-y-cosmos-baja-california.html',{waitUntil:'domcontentloaded'});
            const chapters=await p.locator('.station').count();if(chapters!==4)throw Error('Incorrect chapters');
            for(const id of ['vuelo','atmosfera','orbita','luna'])if(!await p.locator('#'+id).isVisible())throw Error('Section missing '+id);
            await p.locator('[data-activity="bird"][data-answer="yes"]').click();
            if(!(await p.locator('#bird-answer').innerText()).includes('alimento'))throw Error('Bird interaction failed');
            await p.locator('#seaTemp').fill('28');
            if(!(await p.locator('#seaTempValue').innerText()).includes('28'))throw Error('Climate slider failed');
            await p.locator('[data-view="polar"]').click();
            if(!(await p.locator('#satExplanation').innerText()).includes('órbita baja'))throw Error('Satellite comparison failed');
            await p.locator('[data-bird="frigate"]').click();
            if(!(await p.locator('#birdIDResult').innerText()).includes('fragata'))throw Error('Bird identification failed');
            await p.locator('#wetlandChoice').selectOption('lapaz');
            if(!(await p.locator('#wetlandFact').innerText()).includes('Estuario'))throw Error('Wetland comparison failed');
            await p.locator('#weatherEvidence').fill('Observo nubes sobre el Pacífico');
            await p.locator('#saveFieldNotes').click();
            if(!(await p.locator('#fieldSaveResult').innerText()).includes('guardadas'))throw Error('Field notebook save failed');
            await p.locator('#lightyears').fill('250');
            if(!(await p.locator('#lyResult').innerText()).includes('250 años'))throw Error('Light travel activity failed');
            await p.locator('[data-activity="migration"][data-answer="yes"]').click();
            if(!(await p.locator('#migration-answer').innerText()).includes('paradas'))throw Error('Migration activity failed');
            await p.locator('[data-activity="tracking"][data-answer="yes"]').click();
            if(!(await p.locator('#tracking-answer').innerText()).includes('detecciones'))throw Error('Motus interpretation failed');
            await p.locator('#trackingEvidence').fill('Fuente Pronatura 2026');
            await p.locator('#saveTracking').click();
            if(!(await p.locator('#trackingSaveMessage').innerText()).includes('guardada'))throw Error('Motus notebook save failed');
            await p.locator('[data-site="lapaz"]').click();
            if(!(await p.locator('#siteTitle').innerText()).includes('La Paz'))throw Error('Migratory map site failed');
            await p.locator('[data-migration="north"]').click();
            if(!(await p.locator('#migrationSeason').innerText()).includes('primavera'))throw Error('Migratory direction failed');
            await p.locator('#mapFieldNote').fill('Se perdería una escala de descanso.');
            await p.locator('#saveMapNotes').click();
            if(!(await p.locator('#mapSaved').innerText()).includes('guardada'))throw Error('Migratory notebook failed');
            await p.locator('#lightPollution').fill('90');
            if(!(await p.locator('#observatoryResult').innerText()).includes('iluminación artificial'))throw Error('Observatory experiment failed');
            await p.locator('#skyQuestion').fill('¿Por qué flota una estación espacial?');
            if(await p.locator('#skyQuestionForm button').isEnabled())throw Error('Fake AI enabled');
            if(err.length)throw Error(err.join(' | '));
            console.log('PASS',v.width,'full educational flow');
            await p.close();
          }
          await b.close();
          NODE
