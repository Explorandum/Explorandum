name: EXPLORANDUM - metraje libre científico
on:
  push:
    paths:
      - 'tools/nuevos_videos_institucionales.py'
      - '.github/workflows/videos-institucionales-libres.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg autocontenido
        run: python3 -m pip install --break-system-packages -q imageio-ffmpeg
      - name: Descargar y crear extractos auténticos de dos grabaciones reutilizables
        run: python3 tools/nuevos_videos_institucionales.py
      - name: Comprobar y publicar
        run: |
          set -euo pipefail
          test -s media/real/tiburon-zorro-real.mp4
          test -s media/real/pulpos-profundidad-noaa.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/real/tiburon-zorro-real.mp4 media/real/pulpos-profundidad-noaa.mp4
          git commit -m "Agregar extractos de metraje NOAA dominio publico y tiburon zorro CC0"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
