name: Verificar enlaces publicos de EXPLORANDUM
on:
  push:
    paths:
      - '.github/workflows/verificar-enlaces-publicos.yml'
  workflow_dispatch:
jobs:
  http-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comprobar respuestas HTTP reales desde internet
        run: |
          set -eu
          base='https://prepdiplo-web.github.io/Explorandum'
          for path in '/' '/inmersion-documental.html' '/oceano-inmersivo-3d.html' '/cabina-documental.html' '/cabina-video-real.html' '/media/real/tiburon-ballena.mp4' '/media/real/arrecife-real.mp4' '/media/real/ballena-jorobada.mp4' '/media/real/lobo-marino.mp4' '/cabina-video-real-cinco.html' '/media/real/tortuga-marina.mp4' '/cabina-video-real-ocho.html' '/cabina-dos-mares.html' '/cabina-nueve-descubrimientos.html' '/media/real/tiburon-zorro-real.mp4' '/media/real/ballena-jorobada-azul.mp4' '/media/real/bosque-algas.mp4' '/media/real/ctenoforo-california.mp4' '/media/real/medusa-oceano-profundo.mp4'; do
            echo "Verificando: ${base}${path}"
            code=$(curl -L --retry 3 --retry-delay 3 --connect-timeout 15 -sS -o /tmp/explorandum-body -w '%{http_code}' "${base}${path}")
            echo "HTTP ${code}; bytes=$(wc -c </tmp/explorandum-body)"
            head -c 130 /tmp/explorandum-body || true
            echo
            if [ "${code}" != '200' ]; then
              echo "::error::Fallo HTTP en ${path}: ${code}"
              exit 1
            fi
          done
