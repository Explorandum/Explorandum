name: EXPLORANDUM - portada terrestre panoramica
on:
  push:
    paths:
      - '.github/workflows/portada-tierra-panoramica.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Descargar foto real de Valle de los Cirios con atribucion CC BY-SA
        run: |
          set -euo pipefail
          mkdir -p media/terrestre
          curl -L --fail --retry 3 --max-time 75 -A 'ExplorandumEducational/1.0 (Wikimedia Commons)' 'https://commons.wikimedia.org/wiki/Special:FilePath/Valle_de_los_Cirios_-_panoramio_(1).jpg?width=1600' -o media/terrestre/valle-cirios-portada.jpg
          file media/terrestre/valle-cirios-portada.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('media/terrestre/valle-cirios-portada.jpg')
          assert p.read_bytes()[:3]==b'\xff\xd8\xff'
          assert p.stat().st_size>50000
          print('OK panorama',p.stat().st_size)
          PY
      - name: Publicar foto con copia local
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/terrestre/valle-cirios-portada.jpg
          git commit -m 'Guardar panorama terrestre real Valle de los Cirios para portada'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
