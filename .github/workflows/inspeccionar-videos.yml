name: EXPLORANDUM - inspeccion visual fotogramas
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-videos.yml'
  workflow_dispatch:
jobs:
  contact-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preparar FFmpeg ligero
        run: python3 -m pip install --break-system-packages -q imageio-ffmpeg
      - name: Extraer fotogramas para controlar encuadre y color
        run: |
          python3 - <<'PY'
          import subprocess,base64,pathlib,imageio_ffmpeg
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          for name in ('ballena-madre-cria','raya-comun','morena-aleta-amarilla','ctenoforo-california','medusa-oceano-profundo','ballena-jorobada-azul'):
              src=pathlib.Path('media/real')/(name+'.mp4')
              if not src.exists(): raise SystemExit('FALTA '+str(src))
              out='/tmp/'+name+'.jpg'
              subprocess.run([ffmpeg,'-hide_banner','-loglevel','error','-y','-i',str(src),'-vf','fps=1/4,scale=320:180,tile=4x1','-frames:v','1','-q:v','5',out],check=True)
              encoded=base64.b64encode(pathlib.Path(out).read_bytes()).decode()
              print('QC_BEGIN_'+name+':'+encoded+':QC_END_'+name,flush=True)
          PY
