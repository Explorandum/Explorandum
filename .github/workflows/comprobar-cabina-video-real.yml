name: EXPLORANDUM - comprobar video real en navegador
on:
  push:
    paths:
      - 'cabina-video-real.html'
      - 'media/real/**'
      - '.github/workflows/comprobar-cabina-video-real.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Comprobar cuatro videos HD descargados
        run: |
          set -e
          for f in tiburon-ballena arrecife-real ballena-jorobada lobo-marino; do
            test -s "media/real/$f.mp4"
          done
          python3 -m http.server 8765 >/tmp/real-site.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1440,height:900}});
          const errs=[];p.on('pageerror',e=>errs.push(e.message));
          await p.goto('http://127.0.0.1:8765/cabina-video-real.html',{waitUntil:'domcontentloaded'});
          await p.locator('#begin').click();
          await p.waitForFunction(()=>document.getElementById('moving').videoWidth>=640,null,{timeout:20000});
          console.log('Primer video decodificado:',await p.locator('#moving').evaluate(v=>v.videoWidth+'x'+v.videoHeight));
          const n=await p.evaluate(()=>species.length);
          if(n!==4)throw Error('Se esperaban 4 escenas, hay '+n);
          for(let i=0;i<n;i++){
            const datum=await p.evaluate(async ()=>{
              const v=document.getElementById('moving');
              const url=v.getAttribute('src');
              const response=await fetch(url);
              return {url,status:response.status,contentType:response.headers.get('content-type')};
            });
            if(datum.status!==200)throw Error(JSON.stringify(datum));
            if(!datum.url.startsWith('media/real/'))throw Error('No es vídeo real alojado localmente');
            await p.locator('#next').click();
          }
          await p.locator('#inspect').click();
          if(!await p.locator('#brief').isVisible())throw Error('No abre ficha');
          if(errs.length)throw Error('Errores JS: '+errs.join(' | '));
          await p.locator('#close').click();
          await p.screenshot({path:'/tmp/cabina-video-real.png'});
          console.log('PASS: 4 videos locales, HTTP 200, navegación, fichas, sin JS errors');
          await b.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vista-cabina-video-real
          path: /tmp/cabina-video-real.png
          if-no-files-found: ignore
