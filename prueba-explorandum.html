>Oceanía</option><option>Antártida</option></select><input class="field place" id="place" required aria-label="Lugar que quieres explorar" placeholder="Escribe un lugar, país o región…"><input type="radio" class="radio free" name="mode" value="libre" checked aria-label="Exploración libre"><input type="radio" class="radio history" name="mode" value="historia" aria-label="Expedición histórica"><input type="radio" class="radio science" name="mode" value="ciencia" aria-label="Investigación científica"><button class="hot start" type="submit" aria-label="Comenzar mi exploración"></button></form><button class="hot person" style="left:13%" data-person="Diego" aria-label="Conocer a Diego"></button><button class="hot person" style="left:28%" data-person="Valeria" aria-label="Conocer a Valeria"></button><button class="hot person" style="left:43%" data-person="Aki" aria-label="Conocer a Aki"></button><button class="hot person" style="left:58%" data-person="Nova" aria-label="Conocer a Nova"></button><button class="hot person" style="left:73%" data-person="Río" aria-label="Conocer a Río"></button><button class="hot" style="left:88%;top:75%;width:11%;height:22%" id="all" aria-label="Conocer a todos los personajes"></button><div class="chosen" id="chosen" hidden></div></main></div><div class="modal" id="modal" hidden><article role="dialog" aria-modal="true" aria-labelledby="title"><h2 id="title"></h2><p id="description"></p><button id="choose">Elegir compañero</button> <button id="close">Cerrar</button></article></div><script>const continent=document.getElementById('continent'),place=document.getElementById('place'),modal=document.getElementById('modal');let companion='',pending='';const people={Diego:'Un explorador curioso e incansable. Le gusta observar, hacer preguntas y seguir pistas inesperadas.',Valeria:'Viajera, fotógrafa y narradora. Busca historias en los detalles y escucha a las personas.',Aki:'Inventor y explorador de estilo anime. Le apasionan los mecanismos, las ideas imposibles y la tecnología.',Nova:'Exploradora del espacio y el universo. Mira al cielo y se pregunta cómo funciona todo.',Río:'Amigo de la naturaleza y la vida salvaje. Observa animales, ecosistemas y relaciones invisibles.'};document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{continent.value=b.dataset.map;place.focus()}));function showPerson(name){pending=name;document.getElementById('title').textContent=name;document.getElementById('description').textContent=people[name];document.getElementById('choose').hidden=false;modal.hidden=false}document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>showPerson(b.dataset.person)));document.getElementById('all').addEventListener('click',()=>{document.getElementById('title').textContent='Tus compañeros de exploración';document.getElementById('description').textContent=Object.entries(people).map(([name,desc])=>name+': '+desc).join('  ');document.getElementById('choose').hidden=true;modal.hidden=false});document.getElementById('choose').addEventListener('click',()=>{companion=pending;modal.hidden=true;const el=document.getElementById('chosen');el.textContent='Compañero elegido: '+companion;el.hidden=false});document.getElementById('close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(!continent.value){continent.focus();return}if(!place.value.trim()){place.focus();return}const p=new URLSearchParams({continente:continent.value,lugar:place.value.trim(),tipo:document.querySelector('[name=mode]:checked').value,personaje:companion});location.href=(/baja california|los cabos|playa chileno|la paz|loreto|bah[ií]a concepci[oó]n/i.test(place.value.trim())?'baja-california.html':'experiencia.html')+'?'+p.toString()});</script></body></html>
