<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12313b"><title>EXPLORANDUM · Expedición Baja</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:#203139;font:17px/1.6 system-ui,-apple-system,sans-serif}main{max-width:740px;margin:auto;padding:24px 18px 70px}header{padding:14px 0 30px;border-bottom:1px solid #b9c2be}.brand{font:700 28px Georgia,serif;letter-spacing:.05em}.motto,.muted{font-size:13px;color:#536b70}.eyebrow{color:#35636c;font-size:13px;letter-spacing:.12em;text-transform:uppercase}h1,h2{font-family:Georgia,serif;line-height:1.13}h1{font-size:clamp(39px,9vw,62px)}h2{font-size:clamp(28px,7vw,40px)}.panel{background:#f8f7f2;border:1px solid #bdc8c5;border-radius:8px;padding:23px;margin:25px 0}.choice{display:block;width:100%;text-align:left;background:#ffffff;border:1px solid #9eb2b1;color:#203139;border-radius:6px;margin:12px 0;padding:16px;font:inherit;cursor:pointer;min-height:54px}.choice:hover,.choice:focus-visible{background:#d9e7e5}.btn{background:#254f5b;color:#fff;border:0;border-radius:5px;padding:15px 20px;font:700 16px system-ui;margin:12px 9px 0 0;cursor:pointer}.secondary{background:#dce6e4;color:#23424a}.progress{height:7px;background:#c8d5d2;border-radius:20px;margin:22px 0}.progress div{height:100%;background:#467b79;border-radius:20px}.feedback{border-left:4px solid #467b79;background:#e9efeb;padding:14px;margin-top:18px}.map{display:block;width:100%;max-height:220px;border-radius:16px;margin:22px 0;background:#123844}textarea{width:100%;min-height:150px;background:#ffffff;border:1px solid #9aafaa;color:#203139;border-radius:10px;padding:14px;font:16px/1.5 system-ui}footer{border-top:1px solid #b9c2be;padding-top:20px;color:#b8cbc6;font-size:12px}
.real-map{margin:24px 0;border:1px solid #9bada9;overflow:hidden;background:#e7ebe6}.real-map iframe{display:block;width:100%;height:340px;border:0}.map-caption{font-size:12px;line-height:1.6;padding:10px 12px;color:#334d55}.map-caption a{color:#1b586b}.feedback p{margin:9px 0 0}.hint{color:#cbd9d5;font-size:14px;margin-top:12px}button:focus-visible{outline:3px solid #e6e8ae;outline-offset:2px}</style></head><body><main><header><div class="brand">EXPLORANDUM</div><div class="motto">Descubrir. Comprender. Estudiar.</div></header><div id="app"></div><footer>Expedición Baja · Los avances se guardan solo en este navegador, sin cuentas ni datos personales.</footer></main>
<script>
"use strict";
const app=document.getElementById("app"),key="explorandum-baja-mision-01";
let state={route:null,step:0,answers:{},done:false};
try{const s=JSON.parse(localStorage.getItem(key));if(s&&["campo","analisis"].includes(s.route))state=s}catch(e){}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const map='<svg class="map" viewBox="0 0 420 200" role="img" aria-label="Esquema simplificado de la península y el golfo de California; no está a escala"><rect width="420" height="200" rx="15" fill="#143845"/><path d="M170 0L195 20 204 52 211 84 227 111 231 145 248 181 236 190 213 156 190 125 178 90 167 45Z" fill="#cfbb91"/><path d="M246 0H420V200H284L267 169 251 125 234 84 230 40Z" fill="#859873"/><path d="M226 10L220 50 232 96 248 138 270 188" stroke="#95d7de" stroke-width="3" stroke-dasharray="6 6" fill="none"/><g fill="#fff" font-size="13"><text x="27" y="91">Océano</text><text x="27" y="109">Pacífico</text><text x="285" y="80">Continente</text><text x="245" y="25" font-size="11">Golfo de</text><text x="245" y="39" font-size="11">California</text></g></svg>';
const realMap="<div class=\"real-map\"><iframe title=\"Mapa geográfico real de Baja California y el golfo de California\" loading=\"lazy\" referrerpolicy=\"no-referrer\" src=\"https://www.openstreetmap.org/export/embed.html?bbox=-116.9%2C22.0%2C-105.0%2C32.0&amp;layer=mapnik\"></iframe><div class=\"map-caption\">Cartografía geográfica · © colaboradores de OpenStreetMap · <a href=\"https://worldview.earthdata.nasa.gov/?v=-117,21,-105,33\" target=\"_blank\" rel=\"noopener\">Explorar imágenes de satélite en NASA Worldview ↗</a></div></div>";
const questions={
campo:[
{title:"Una forma que plantea preguntas",intro:"Mira el mapa. Parece que la península de Baja California estuviera separada del continente. ¿Qué podemos afirmar solo por su forma?",options:["Que merece la pena investigar cómo se formó","Que un terremoto la arrancó de golpe","Que las olas excavaron toda la separación"],right:0,explain:"La observación permite plantear una hipótesis, pero todavía no demuestra cómo ocurrió.",reflection:"¿Qué pruebas buscarías en las rocas?"},
{title:"El tiempo de las rocas",intro:"Experimento mental: dos bloques se separan 4 centímetros por año. ¿Cuánto se habrán separado en 100 años? Es una cifra inventada para practicar, no una medición del golfo.",options:["4 metros","40 metros","400 metros"],right:0,explain:"4 × 100 = 400 centímetros, es decir, 4 metros.",reflection:"¿Por qué un cambio minúsculo puede resultar enorme después de millones de años?"},
{title:"La historia de un mar",intro:"¿Cuál es la explicación más sólida para la formación del golfo de California?",options:["Movimientos tectónicos y fallas a lo largo de millones de años","Un único terremoto que abrió todo el mar","Solo el desgaste causado por las olas"],right:0,explain:"El golfo está relacionado con una evolución tectónica compleja, no con un solo episodio.",reflection:"¿Cómo distinguirías una falla geológica de una grieta superficial?"},
{title:"Tu cuaderno de campo",intro:"Alguien dice: «La península parece una pieza suelta, así que ya sabemos cómo se formó». ¿Qué le responderías?",write:"Explica en 2–4 frases qué observas, qué hipótesis tienes y qué pruebas buscarías."}
],
analisis:[
{title:"Hipótesis y evidencia",intro:"La forma del golfo sugiere una separación tectónica. ¿Qué pruebas contrastarían mejor esa hipótesis?",options:["Correspondencias geológicas, edades de rocas y mediciones del movimiento de placas","Únicamente el parecido visual entre las costas","La salinidad del agua"],right:0,explain:"Varias evidencias independientes permiten comprobar una hipótesis con más rigor.",reflection:"¿En qué se diferencia una coincidencia de una relación causal?"},
{title:"Escalas de tiempo",intro:"Cálculo hipotético: si dos bloques se separasen 45 milímetros al año durante 2 millones de años, ¿qué desplazamiento acumularían? No es una reconstrucción real del golfo.",options:["90 kilómetros","9 kilómetros","900 kilómetros"],right:0,explain:"45 × 2.000.000 = 90.000.000 milímetros = 90 kilómetros.",reflection:"¿Por qué es arriesgado extrapolar una velocidad actual a millones de años?"},
{title:"Construir un modelo",intro:"El golfo está relacionado con fallas, extensión y movimientos relativos entre placas. ¿Qué explicación resulta más convincente?",options:["Una evolución tectónica compleja respaldada por varias evidencias","Un único terremoto instantáneo","Exclusivamente la erosión del oleaje"],right:0,explain:"Un buen modelo debe explicar las observaciones, los procesos y las escalas temporales.",reflection:"¿Qué observaciones distinguirían la erosión marina de la deformación tectónica?"},
{title:"Dictamen científico",intro:"Un titular afirma: «La forma de Baja California demuestra que el continente se partió en dos». Evalúa críticamente esa afirmación.",write:"Redacta 4–6 frases: observación, hipótesis, dos tipos de pruebas, una limitación y conclusión provisional."}
]};
function begin(route){state={route,step:0,answers:{},done:false};save();render()}
function select(i){state.answers["a"+state.step]=i;save();render()}
function next(){state.step++;save();render();scrollTo(0,0)}
function finish(){const t=document.getElementById("answer").value.trim();if(!t){document.getElementById("notice").textContent="Escribe primero tu explicación.";return}state.answers["t"+state.step]=t;state.done=true;save();render();scrollTo(0,0)}
function reset(){if(confirm("¿Empezar otra vez? Se borrará el progreso de este dispositivo.")){state={route:null,step:0,answers:{},done:false};save();render()}}
function copy(){const q=questions[state.route];const t=q.map((x,i)=>(i+1)+". "+x.title+"\n"+(x.write?(state.answers["t"+i]||""):(x.options[state.answers["a"+i]]||"Sin responder"))).join("\n\n");if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Cuaderno copiado")).catch(()=>prompt("Copia tu cuaderno:",t));else prompt("Copia tu cuaderno:",t)}
function render(){
if(!state.route){app.innerHTML='<div class="eyebrow" style="margin-top:32px">Primera expedición · Baja California</div><h1>El mar que nació de una fractura</h1><p>¿Cómo puede surgir un mar entre una península y un continente? Investiga con preguntas, pruebas, cálculos y tus propias conclusiones.</p>'+realMap+'<section class="panel"><h2>Elige tu ruta</h2><p>Dos recorridos independientes. Sin notas ni cronómetro.</p><button class="choice" onclick="begin(\'campo\')">Ruta de campo · 11+ años</button><button class="choice" onclick="begin(\'analisis\')">Ruta de análisis · 14+ años</button><p class="muted">Cada teléfono conserva su propio avance.</p></section><p class="muted">Próximamente: el desierto junto al mar, fauna marina, cactus, rocas e historia de Baja California.</p>';return}
const qs=questions[state.route],label=state.route==="campo"?"Ruta de campo":"Ruta de análisis";
if(state.done){app.innerHTML='<div class="eyebrow" style="margin-top:32px">Misión 01 completada</div><h1>Expediente científico cerrado</h1><p>La formación del golfo de California está relacionada con procesos tectónicos prolongados. Una forma en el mapa plantea preguntas; las evidencias geológicas permiten comprobar hipótesis.</p><section class="panel"><h2>Investigación fuera de la pantalla</h2><p>Observa una roca o una montaña. Distingue lo que ves de lo que supones. ¿Qué pruebas te ayudarían a conocer su historia?</p><button class="btn" onclick="copy()">Copiar mi cuaderno</button><button class="btn secondary" onclick="reset()">Empezar otra ruta</button></section>';return}
const q=qs[state.step],a=state.answers["a"+state.step];let h='<div class="eyebrow" style="margin-top:32px">Expedición Baja · '+label+'</div><div class="progress"><div style="width:'+(state.step/qs.length*100)+'%"></div></div><p class="muted">Etapa '+(state.step+1)+' de '+qs.length+'</p><h2>'+escapeHTML(q.title)+'</h2>'+realMap+'<section class="panel"><p>'+escapeHTML(q.intro)+'</p>';
if(q.write){h+='<label for="answer">'+escapeHTML(q.write)+'</label><textarea id="answer" placeholder="Escribe tu explicación...">'+escapeHTML(state.answers["t"+state.step]||"")+'</textarea><p class="muted" id="notice"></p><button class="btn" onclick="finish()">Terminar la misión</button>'}
else{q.options.forEach((o,i)=>h+='<button class="choice" onclick="select('+i+')">'+String.fromCharCode(65+i)+'. '+escapeHTML(o)+'</button>');if(a!==undefined){h+='<div class="feedback">'+(a===q.right?'<strong>Bien razonado.</strong> ':'<strong>Vuelve a examinar la evidencia.</strong> ')+(a===q.right?escapeHTML(q.explain)+'<p><strong>Para pensar:</strong> '+escapeHTML(q.reflection)+'</p>':'<p>Revisa tu procedimiento y prueba otra opción. No necesitas acertar a la primera.</p><details class="hint"><summary>¿Necesitas una pista?</summary><p>'+escapeHTML(state.step===1?(state.route==='campo'?'Piensa primero cuántos centímetros hay en un metro. Después multiplica los centímetros por año por el número de años.':'Convierte primero los milímetros a metros y después a kilómetros. Comprueba cada unidad.'):'Distingue lo que observas de lo que puedes demostrar. ¿Qué prueba apoyaría realmente esa afirmación?')+'</p></details>')+'</div>';if(a===q.right)h+='<button class="btn" onclick="next()">Continuar →</button>'}}
app.innerHTML=h+'</section><p class="muted">Tu progreso se guarda en este dispositivo.</p>'
}
render();
</script></body></html>
