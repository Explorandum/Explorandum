<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a3a"><title>Explorandum · El mapa imposible</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7efe0;background:#0e2633}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 15%,#275a68 0%,transparent 40%),linear-gradient(160deg,#102b39,#172c35 58%,#372e29);min-height:100vh}main{max-width:980px;margin:auto;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0 20px;border-bottom:1px solid #ffffff30}.brand{font-family:Georgia,serif;font-size:clamp(23px,5vw,34px);letter-spacing:.12em;color:#f3c780}.tag{font-size:12px;color:#c7d3ce}.small{font-size:13px;color:#c9d6d7}.eyebrow{color:#efc57b;text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700}.hero{padding:40px 0 18px}h1,h2,h3{font-family:Georgia,serif;line-height:1.15;margin:12px 0;color:#ffe0a5}h1{font-size:clamp(35px,7vw,62px)}h2{font-size:clamp(28px,5vw,43px)}p{line-height:1.7}.panel{background:#fff9ec0e;border:1px solid #e5cda04a;border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 12px 40px #0002}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.option{display:block;text-align:left;background:#173846;border:1px solid #d1b67e70;border-radius:15px;color:#fff5e4;padding:19px;font:inherit;cursor:pointer;min-height:110px}.option:hover,.option:focus-visible{background:#285366;outline:2px solid #e6c17f}.option strong{display:block;color:#ffe0a5;font-size:19px;margin-bottom:7px}.option span{font-size:14px;line-height:1.5;color:#e4e9e4}.action{background:#e5b96d;color:#1c2d36;border:0;border-radius:12px;padding:13px 17px;font-weight:800;font-size:15px;cursor:pointer;margin:6px 8px 6px 0}.ghost{background:#284c5c;color:#fff3dc;border:1px solid #9bb7bd}.action:focus-visible{outline:3px solid white}.scene{background:linear-gradient(150deg,#533f2b,#122e3d 60%,#0d4650);border-radius:18px;min-height:215px;display:flex;align-items:end;padding:22px;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 10%,#edb66585,transparent 48%)}.scene>*{position:relative}.quote{font-family:Georgia,serif;font-size:clamp(21px,4vw,29px);line-height:1.5;max-width:700px}.mapframe{width:100%;height:360px;border:0;border-radius:12px;background:#173744}.mapnote{font-size:12px;color:#c8d6d8}.artifact{background:#dbc49a;color:#362c25;padding:18px;border-radius:12px;transform:rotate(-1deg);box-shadow:0 8px 20px #0004}.artifact svg{width:100%;max-height:250px}.artifact p{color:#51402d;font-size:13px;margin:4px 0}.crumb{font-size:13px;color:#ebc985}.trail{display:flex;gap:8px;flex-wrap:wrap}.trail button{background:#193a47;border:1px solid #8fa8aa;color:#f7e6c6;border-radius:30px;padding:9px 12px;cursor:pointer}a{color:#f8cd82}footer{padding-top:35px;border-top:1px solid #ffffff29;font-size:12px;color:#c7d4d2}details{padding:12px;background:#ffffff0a;border-radius:10px}summary{cursor:pointer;color:#f5d18f} @media(max-width:520px){main{padding:12px 13px 65px}.panel{padding:17px}.mapframe{height:300px}.top{align-items:start}}
</style></head><body><main><header class="top"><div><div class="brand">EXPLORANDUM</div><div class="tag">El aprendizaje como fuente de felicidad</div></div><button class="action ghost" onclick="go('home')">Inicio</button></header><div id="app"></div><footer>Modo Explorar · Sin reloj, sin notas y sin obligación de terminar. Tu avance se conserva en este navegador; no se sincroniza entre dispositivos. Prototipo narrativo: los mapas esquemáticos no son documentos históricos.</footer></main>
<script>
"use strict";
const KEY="explorandum-explorar-prototipo-01";
let state={page:"home",guide:"",visited:[],notes:[]};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.page==="string"&&Array.isArray(v.visited))state={...state,...v}}catch(e){}
const app=document.getElementById("app");
const labels={mapa:"El mapa imposible",costa:"El continente que se mueve",voces:"Antes de los mapas",pregunta:"La pregunta incómoda"};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function go(page){state.page=page;if(labels[page]&&!state.visited.includes(page))state.visited.push(page);save();render();window.scrollTo(0,0)}
function guide(id){state.guide=id;go("hall")}
function pick(id){if(!state.notes.includes(id))state.notes.push(id);save();render()}
const guides={arqueologo:["El Explorador","He perseguido pistas en desiertos y archivos. Las mejores suelen empezar con algo que no encaja."],cientifica:["La Científica","Si una historia parece imposible, no la descarto: primero busco pruebas."],filosofa:["La Filósofa","La pregunta más interesante no siempre es qué sabemos, sino por qué creemos saberlo."],anime:["Akira, la cartógrafa","Colecciono mapas de lugares que parecen imposibles. Algunos secretos se esconden a plena vista."],solo:["A tu aire","Explora sin guía. Puedes elegir acompañante más adelante."]};
const intro='<div class="hero"><div class="eyebrow">Modo Explorar · Primera aventura</div><h1>El mapa imposible</h1><p>Una península aparece como una isla. Un mar se abre entre tierras que antes estaban unidas. Y una pregunta puede cambiarlo todo.</p></div>';
const nav='<div class="trail"><button onclick="go(\'hall\')">Campamento</button><button onclick="go(\'mapa\')">Mapa antiguo</button><button onclick="go(\'costa\')">Costa</button><button onclick="go(\'voces\')">Voces</button><button onclick="go(\'pregunta\')">Filosofía</button></div>';
const opt=(title,desc,page)=>'<button class="option" onclick="go(\''+page+'\')"><strong>'+title+'</strong><span>'+desc+'</span></button>';
const sat='<div class="panel"><div class="eyebrow">Ventana al mundo real</div><h3>El golfo de California desde el espacio</h3><iframe class="mapframe" title="Mapa satelital interactivo del golfo de California" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=27.6,-111.4&t=k&z=7&output=embed"></iframe><p class="mapnote">Puedes acercarte y desplazarte. Google Maps es una representación moderna, no un mapa del siglo XVII.</p></div>';
const antique='<div class="artifact"><svg viewBox="0 0 560 260" role="img" aria-label="Ilustración esquemática ficticia de California representada como isla, no reproducción de un mapa antiguo"><rect width="560" height="260" fill="#d8bd87"/><g fill="none" stroke="#806c4b" stroke-width="1.2" opacity=".5"><path d="M0 65Q130 25 270 65T560 45M0 130Q160 110 290 130T560 115M0 190Q130 155 280 200T560 180"/></g><path d="M310 0L560 0V260H390L350 210 338 158 325 110 332 56Z" fill="#a18b5c" stroke="#5c5139" stroke-width="3"/><path d="M205 16L231 30 239 67 258 103 260 146 284 184 270 236 249 215 238 174 218 141 210 92 196 54Z" fill="#a18b5c" stroke="#5c5139" stroke-width="3"/><g font-family="Georgia,serif" fill="#5c4b30"><text x="55" y="116" font-size="21">MAR DEL SUR</text><text x="170" y="252" font-size="14">CALIFORNIA · ¿ISLA?</text><text x="365" y="96" font-size="18">TIERRA FIRME</text></g></svg><p>Ilustración interpretativa para plantear el misterio. No es una fuente histórica original.</p></div>';
function render(){
let h="";
if(state.page==="home"){h=intro+'<div class="scene"><div><div class="eyebrow">Un misterio real</div><div class="quote">«Durante mucho tiempo, algunos mapas europeos representaron California como una isla. Pero no lo es. ¿Qué ocurrió?»</div></div></div><div class="panel"><h2>¿Quién te acompaña?</h2><p>Elige una voz para empezar. Podrás cambiarla en cualquier momento, o explorar a tu aire.</p><div class="options">'+Object.entries(guides).map(([id,g])=>'<button class="option" onclick="guide(\''+id+'\')"><strong>'+g[0]+'</strong><span>'+g[1]+'</span></button>').join("")+'</div></div>'+(state.visited.length?'<button class="action" onclick="go(\'hall\')">Volver a mi aventura</button>':"")}
else if(state.page==="hall"){const g=guides[state.guide]||guides.solo;h='<div class="hero"><div class="eyebrow">Campamento · El golfo de California</div><h1>Una pista. Tres caminos.</h1><p class="quote">«'+g[1]+'»</p><p class="small">Te acompaña: '+g[0]+' · <button class="action ghost" onclick="go(\'home\')">Cambiar</button></p></div><div class="scene"><div><div class="eyebrow">Sobre la mesa</div><div class="quote">Un mapa antiguo muestra una isla donde hoy ves una península. Fuera, el mar guarda otra historia: la de un continente en movimiento.</div></div></div><div class="panel"><h2>¿Por dónde empezamos?</h2><div class="options">'+opt("El mapa que engañó a Europa","Investiga cómo una idea equivocada llegó a parecer cierta.","mapa")+opt("La costa que se mueve","Mira el paisaje desde el espacio y descubre qué fuerzas lo transformaron.","costa")+opt("Las voces anteriores","¿Quién conocía esta tierra antes de que apareciera en los mapas europeos?","voces")+'</div></div>'}
else if(state.page==="mapa"){h=nav+'<div class="hero"><div class="eyebrow">Archivo del explorador</div><h1>El mapa imposible</h1><p>En los siglos XVII y XVIII circularon mapas europeos que dibujaban California como una isla. No era un descubrimiento: era un error cartográfico persistente.</p></div>'+antique+'<div class="panel"><h3>La pista auténtica</h3><p>El dibujo anterior es una recreación. Para examinar mapas históricos de verdad, abre una colección de reproducciones y compárala con el satélite.</p><p><a href="https://commons.wikimedia.org/wiki/Category:Maps_of_California_as_an_island" target="_blank" rel="noopener">Ver mapas históricos de California como isla ↗</a></p><details><summary>¿Por qué pudo perdurar el error?</summary><p>Los cartógrafos dependían de relatos, copias y observaciones incompletas. Que una idea aparezca repetida en muchos mapas no la convierte en verdadera: a veces todos dependen de una misma fuente.</p></details></div>'+sat+'<div class="panel"><h3>Una pregunta que abre otra puerta</h3><p>¿Qué vale más: un mapa muy antiguo o una observación comprobable?</p><button class="action" onclick="go(\'pregunta\')">Seguir esta pregunta</button><button class="action ghost" onclick="pick(\'mapa\')">Guardar el hallazgo</button></div>'}
else if(state.page==="costa"){h=nav+'<div class="hero"><div class="eyebrow">La costa · Tiempo profundo</div><h1>Un mar en movimiento</h1><p>Las rocas parecen inmóviles, pero la Tierra cambia. La formación del golfo de California está ligada a movimientos tectónicos complejos durante millones de años.</p></div><div class="scene"><div><div class="quote">«¿Y si las montañas fueran páginas de un libro escrito tan lentamente que nadie pudiera verlo terminar?»</div></div></div>'+sat+'<div class="panel"><h3>Busca una pista en el paisaje</h3><p>Acércate a las costas y a las sierras. Observa la forma alargada del golfo y los relieves de ambos lados. La forma sugiere preguntas; por sí sola no demuestra cómo se formó.</p><details><summary>Una pista geológica, si te apetece</summary><p>Los científicos combinan edades de rocas, fallas, sedimentos y mediciones de movimientos actuales para reconstruir una historia de millones de años. Ninguna fotografía aislada basta.</p></details><button class="action ghost" onclick="pick(\'costa\')">Guardar el hallazgo</button><button class="action" onclick="go(\'voces\')">¿Quién vivía junto a estas costas?</button></div>'}
else if(state.page==="voces"){h=nav+'<div class="hero"><div class="eyebrow">Historia · Voces y silencios</div><h1>Antes de los mapas</h1><p>La península no comenzó a existir cuando llegó a los mapas europeos. Sus pueblos originarios conocían y habitaban estas tierras desde mucho antes.</p></div><div class="scene"><div><div class="quote">«Si alguien llega a tu casa y la dibuja por primera vez, ¿la ha descubierto?»</div></div></div><div class="panel"><h3>¿Quién cuenta la historia?</h3><p>Entre los pueblos históricos de la península se encuentran comunidades cochimíes, pericúes y guaycuras, con historias y territorios diferentes. No debemos tratarlas como una sola cultura ni inventar leyendas en su nombre.</p><details><summary>Una mirada desde la filosofía de la historia</summary><p>Una fuente puede ser verdadera en lo que cuenta y, aun así, incompleta por lo que omite. Comparar perspectivas ayuda a entender quién escribió el relato y quién no pudo hacerlo.</p></details><button class="action ghost" onclick="pick(\'voces\')">Guardar el hallazgo</button><button class="action" onclick="go(\'pregunta\')">Abrir una pregunta difícil</button></div>'}
else if(state.page==="pregunta"){h=nav+'<div class="hero"><div class="eyebrow">La sala de las preguntas</div><h1>¿Cómo sabemos que sabemos?</h1><p>Un mapa puede estar bellamente dibujado y ser falso. Un testimonio puede ser sincero y estar equivocado. Una historia puede contar hechos reales y dejar fuera otras voces.</p></div><div class="scene"><div><div class="quote">«Si todos repiten una idea, ¿se vuelve verdadera?»</div></div></div><div class="panel"><h3>No hay examen aquí</h3><p>Si quieres, piensa qué harías para comprobar un mapa que contradice otro. Puedes conversar con alguien, abrir otro camino o simplemente dejar la pregunta flotando.</p><button class="action ghost" onclick="pick(\'pregunta\')">Guardar esta pregunta</button><button class="action" onclick="go(\'hall\')">Volver al campamento</button></div>'}
else{state.page="home";save();return render()}
if(state.page!=="home"){h+='<div class="panel"><div class="eyebrow">Tu mochila de hallazgos</div><p>'+ (state.notes.length?state.notes.map(x=>'✦ '+(labels[x]||x)).join(' · '):'Todavía vacía. Puedes guardar descubrimientos cuando te apetezca.')+'</p><p class="small">Has visitado '+state.visited.length+' lugares. No hay objetivos que completar.</p><button class="action ghost" onclick="go(\'hall\')">Volver al campamento</button></div>'}
app.innerHTML=h;
}
render();
</script></body></html>
