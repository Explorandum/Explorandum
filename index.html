<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b22"><title>EXPLORANDUM — El mapa imposible</title><style>
*{box-sizing:border-box}html{background:#0d151a}body{margin:0;color:#f3e8d2;font:16px/1.55 system-ui,-apple-system,sans-serif;background:#0d151a}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe4a2;outline-offset:3px}#app{min-height:100dvh}.world{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 5%,#3b3028,#0c151b 76%)}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px clamp(15px,4vw,44px);position:relative;z-index:4}.logo{font:700 clamp(17px,3vw,25px) Georgia,serif;letter-spacing:.18em}.bar button,.tiny{background:#15252cdd;border:1px solid #a9957255;border-radius:30px;color:#eee2c9;padding:9px 14px;font-size:13px}.chapter{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#dfbc82}.viewport{position:relative;width:min(100%,1180px);margin:auto;aspect-ratio:16/9;min-height:370px;max-height:75dvh;overflow:hidden;border:1px solid #c6a46b42;border-radius:7px;box-shadow:0 20px 90px #000a;background:#15202a}.viewport svg{width:100%;height:100%;display:block}.hotspot{position:absolute;background:transparent;border:0;border-radius:40%;color:transparent}.hotspot:hover,.hotspot:focus-visible{outline:2px solid #f8cf7a;box-shadow:0 0 30px #f8cf7a77;background:#f8cf7a1a}.hotspot:after{content:"✧";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;color:#ffe5a9;text-shadow:0 0 15px #000;opacity:.8}.spot-map{left:33%;top:63%;width:33%;height:27%}.spot-window{left:68%;top:14%;width:19%;height:47%}.spot-case{left:8%;top:36%;width:22%;height:40%}.spot-door{left:88%;top:19%;width:11%;height:67%}.narrative{position:absolute;left:0;right:0;bottom:0;padding:45px clamp(20px,5vw,65px) 24px;background:linear-gradient(transparent,#071015ec 35%,#071015f9);pointer-events:none}.narrative .line{font:clamp(20px,3.1vw,37px)/1.25 Georgia,serif;max-width:830px;text-shadow:0 3px 15px #000}.narrative .hint{font-size:12px;letter-spacing:.06em;color:#e8c58c;margin-top:13px}.bottom{width:min(100%,1180px);margin:0 auto;padding:20px 8px 35px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bottom p{margin:0;color:#c5bdad;font-size:13px}.bottom button,.primary{background:#c9a66a;color:#1b2224;border:0;border-radius:7px;padding:11px 18px;font-weight:700}.overlay{position:absolute;inset:0;z-index:3;background:#09131be8;display:flex;justify-content:center;align-items:center;padding:clamp(15px,4vw,40px);overflow:auto}.sheet{width:min(100%,810px);max-height:100%;overflow:auto;background:linear-gradient(145deg,#26353b,#101d25);border:1px solid #c7a77370;border-radius:12px;padding:clamp(19px,4vw,39px);box-shadow:0 25px 90px #000b}.sheet h1{font:clamp(31px,5vw,56px)/1.08 Georgia,serif;margin:12px 0;color:#f7d79d}.sheet p{color:#ded6c8;max-width:700px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:25px}.choices button{background:#1a3038;color:#f6e8cd;border:1px solid #b99a656b;border-radius:8px;text-align:left;padding:17px;min-height:90px}.choices button:hover{background:#30505a}.choices strong{display:block;color:#f5d294;margin-bottom:5px}.choices span{font-size:13px}.close{float:right;background:transparent;color:#f7d7a0;border:1px solid #d1b47a55;border-radius:30px;padding:7px 12px}.artifact{margin:18px 0;background:#cbb486;border:9px solid #78603f;box-shadow:0 15px 40px #0008;padding:12px;color:#423b2e;transform:rotate(-1deg)}.artifact svg{width:100%;height:auto;display:block}.caption{font-size:12px;color:#c6b9a1}.link{color:#ffdf9f}.realmap{width:100%;height:270px;border:0;border-radius:7px}.discover{background:#b68c49;color:#171c1f;padding:10px 14px;border-radius:6px;border:0;font-weight:700}.foot{font-size:11px;color:#adab9f;max-width:1180px;margin:0 auto 30px;padding:0 15px}.intro{max-width:760px;margin:7vh auto;padding:25px}.intro h1{font:clamp(55px,11vw,110px)/.97 Georgia,serif;letter-spacing:-.04em;margin:18px 0;color:#f6d29a}.intro p{font-size:clamp(17px,2.5vw,23px);max-width:580px;color:#e5dccb}.intro .primary{margin-top:22px;font-size:18px;padding:15px 24px}.intro .chapter{font-size:13px}@media(max-width:650px){.viewport{aspect-ratio:3/4;min-height:460px;max-height:70dvh}.viewport svg{width:100%;height:100%;object-fit:cover}.narrative{padding:45px 18px 20px}.narrative .line{font-size:24px}.spot-map{top:61%;left:24%;width:53%}.spot-window{left:65%;width:25%}.spot-case{left:2%;width:29%}.spot-door{left:88%;width:12%}.sheet{max-height:90dvh}.bottom{padding:15px}.bar{padding:12px}.logo{letter-spacing:.07em}}
</style></head><body><div id="app"></div><script>
"use strict";
const KEY="explorandum-cinematic-scene-v1";
let s={started:false,seen:[],guide:"",overlay:"",moment:0};try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.seen))s={...s,...x}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const mark=id=>{if(!s.seen.includes(id))s.seen.push(id);save()};
function begin(){s.started=true;s.overlay="";s.moment=0;save();render()}
function openThing(id){s.overlay=id;mark(id);render()}
function closeThing(){s.overlay="";save();render()}
function chooseGuide(id){s.guide=id;mark("guide");s.overlay="";s.moment=1;save();render()}
function next(){s.moment=(s.moment+1)%3;save();render()}
const room='<svg viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" aria-label="Habitación de expedición nocturna con mesa, mapa, ventana, vitrina y puerta"><defs><linearGradient id="wall" x2=".7" y2="1"><stop stop-color="#202d30"/><stop offset=".7" stop-color="#514335"/><stop offset="1" stop-color="#171d21"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#362b26"/><stop offset="1" stop-color="#100e11"/></linearGradient><linearGradient id="night" x2="0" y2="1"><stop stop-color="#071b35"/><stop offset=".7" stop-color="#185267"/><stop offset="1" stop-color="#c4a37a"/></linearGradient><radialGradient id="light"><stop stop-color="#f7c27a" stop-opacity=".75"/><stop offset="1" stop-color="#edb268" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="25"/></filter></defs><rect width="1200" height="750" fill="url(#wall)"/><path d="M0 0L200 60V560L0 700M1200 0L1030 65V560L1200 700" fill="#111b1e" opacity=".65"/><path d="M0 545L1200 545V750H0Z" fill="url(#floor)"/><g opacity=".23" stroke="#b69b73"><path d="M0 640L1200 600M0 700L1200 660M250 545L90 750M650 545L660 750M1000 545L1190 750"/></g><rect x="796" y="104" width="245" height="335" fill="#120f0e" stroke="#5d4934" stroke-width="19"/><rect x="812" y="120" width="213" height="300" fill="url(#night)"/><path d="M812 350L865 290 902 320 955 240 1025 330V420H812" fill="#263e47"/><path d="M812 395L890 342 955 375 1025 350V420H812" fill="#132a32"/><path d="M919 120V420M812 273H1025" stroke="#4c3424" stroke-width="12"/><path d="M785 102L812 108 816 440 774 465Z M1040 102L1027 107 1026 442 1065 467Z" fill="#4c3530"/><rect x="1052" y="115" width="120" height="437" fill="#1b1718" stroke="#5c4632" stroke-width="13"/><path d="M1065 130H1158V532H1065Z" fill="#352b27"/><circle cx="1138" cy="344" r="7" fill="#d2b16c"/><rect x="58" y="235" width="230" height="345" fill="#211c1a" stroke="#8c6d47" stroke-width="12"/><path d="M75 260H269V565H75Z" fill="#2e302b"/><path d="M75 365H269M75 464H269" stroke="#8c6d47" stroke-width="8"/><path d="M110 340l28-70 40 70ZM155 445l25-68 30 68" fill="#b49b6e"/><circle cx="227" cy="303" r="24" fill="#a58b59"/><rect x="98" y="480" width="80" height="72" rx="7" fill="#745b3e"/><path d="M178 480l25 20v52h-25" fill="#b9a06d"/><ellipse cx="548" cy="668" rx="480" ry="70" fill="#000" opacity=".65"/><path d="M225 515L875 500 1010 614 135 640Z" fill="#5c3826" stroke="#1d1715" stroke-width="15"/><path d="M220 510L880 498 975 588 158 611Z" fill="#76503a"/><path d="M215 635L190 750H240L270 630M890 616L930 750H982L952 608" fill="#2a1a18"/><path d="M340 534L716 517 789 588 296 601Z" fill="#cfb687" stroke="#6f5134" stroke-width="7"/><path d="M492 535l20 15 7 20 12 17-12-4-15-23-15-18Z" fill="#756b46"/><path d="M565 529L685 526 730 575 585 583Z" fill="#b29c72" opacity=".8"/><g fill="none" stroke="#796342" stroke-width="2"><path d="M340 555L700 544M360 580L725 562M435 530L445 594M625 529L640 584"/></g><path d="M710 490L745 385 770 492" stroke="#59432b" stroke-width="12" fill="none"/><path d="M680 394L770 392 791 433 662 433Z" fill="#b58b51"/><ellipse cx="728" cy="430" rx="200" ry="150" fill="url(#light)" opacity=".8"/><ellipse cx="727" cy="428" rx="80" ry="70" fill="url(#light)" filter="url(#blur)"/><path d="M302 502L342 451 380 495Z" fill="#40372e"/><path d="M314 492L337 460 360 490" fill="#b29b72"/><g fill="#d4bd91" opacity=".65"><circle cx="858" cy="164" r="2"/><circle cx="990" cy="203" r="1.8"/><circle cx="883" cy="215" r="1.5"/></g><rect width="1200" height="750" fill="#0a101a" opacity=".15"/></svg>';
const mapArt='<div class="artifact"><svg viewBox="0 0 650 330" aria-label="Mapa ficticio inspirado en la antigua representación de California como isla"><rect width="650" height="330" fill="#cdb786"/><g stroke="#9d8455" fill="none" opacity=".5"><path d="M0 75Q180 40 330 70T650 70M0 180Q170 140 350 175T650 150M0 270Q180 235 350 260T650 260"/></g><path d="M380 0H650V330H480L450 285 437 225 422 167 428 100Z" fill="#95865e" stroke="#584f3a" stroke-width="4"/><path d="M235 25L263 38 277 85 290 140 307 190 322 240 308 303 284 279 267 233 248 192 236 126 222 65Z" fill="#95865e" stroke="#584f3a" stroke-width="4"/><g font-family="Georgia,serif" fill="#53462e"><text x="50" y="125" font-size="24">MAR DEL SUR</text><text x="172" y="323" font-size="18">CALIFORNIA</text><text x="465" y="135" font-size="19">TIERRA FIRME</text></g></svg></div><div class="caption">Recreación artística, no documento histórico. La representación de California como isla sí aparece en mapas históricos reales.</div>';
function overlay(){
const back='<button class="close" onclick="closeThing()">Volver a la habitación ×</button>';
if(s.overlay==="guide")return back+'<div class="chapter">Alguien llama a la puerta</div><h1>—¿Puedo pasar?</h1><p>La cerradura gira. Una voz pregunta si quieres compañía para investigar el mapa. No tienes que decidir para siempre.</p><div class="choices">'+[['aventurero','El arqueólogo','Persigue pistas entre ruinas y archivos.'],['cientifica','La científica','Busca evidencias antes de aceptar una explicación.'],['akira','Akira, la cartógrafa','Una aventurera de estética anime fascinada por los mapas imposibles.'],['sola','Explorar a mi aire','Sin acompañante, por ahora.']].map(x=>'<button onclick="chooseGuide(\''+x[0]+'\')"><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>';
if(s.overlay==="map")return back+'<div class="chapter">Objeto 01 · Sobre la mesa</div><h1>Una isla donde no la hay</h1><p>La tinta dibuja California separada del continente. No es una broma: algunos cartógrafos europeos la representaron así durante los siglos XVII y XVIII.</p>'+mapArt+'<p>El verdadero misterio no es que alguien se equivocara. Es que el error siguiera viajando de mapa en mapa.</p><div class="choices"><button onclick="openThing(\'evidence\')"><strong>Seguir la pista</strong><span>¿Cómo pudo sobrevivir el error?</span></button><button onclick="openThing(\'window\')"><strong>Mirar el mundo real</strong><span>Comparar la imagen con la costa actual.</span></button></div>';
if(s.overlay==="evidence")return back+'<div class="chapter">Archivo · Una idea que se copia</div><h1>¿Y si todos copian el mismo error?</h1><p>Un mapa puede parecer una prueba independiente, pero si su autor copió otro, y ese otro copió uno anterior, muchas imágenes podrían depender de una única información equivocada.</p><p>Eso plantea una pregunta que también importa hoy: ¿diez fuentes que repiten una afirmación son realmente diez pruebas?</p><p><a class="link" target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/Category:Maps_of_California_as_an_island">Examinar reproducciones de mapas históricos auténticos ↗</a></p><div class="choices"><button onclick="openThing(\'window\')"><strong>Comprobarlo</strong><span>Ir a la ventana y ver la geografía real.</span></button><button onclick="openThing(\'case\')"><strong>Otra pista</strong><span>¿Qué había aquí antes de los mapas europeos?</span></button></div>';
if(s.overlay==="window")return back+'<div class="chapter">Ventana · Más allá de la habitación</div><h1>El mar que no debería existir</h1><p>El golfo de California se abrió mediante procesos tectónicos durante millones de años. La forma del paisaje despierta sospechas, pero los geólogos necesitan estudiar rocas, fallas y edades para reconstruirlo.</p><iframe class="realmap" title="Mapa satelital interactivo del golfo de California" loading="lazy" src="https://maps.google.com/maps?q=27.6,-111.4&t=k&z=7&output=embed"></iframe><p class="caption">Mapa satelital interactivo. Puedes desplazarte y acercarte. Requiere conexión a Google Maps.</p><div class="choices"><button onclick="openThing(\'map\')"><strong>Volver al mapa</strong><span>Dos imágenes, dos maneras de conocer.</span></button><button onclick="openThing(\'case\')"><strong>Escuchar otra historia</strong><span>La tierra no estaba vacía.</span></button></div>';
if(s.overlay==="case")return back+'<div class="chapter">Vitrina · Una historia incompleta</div><h1>¿Quién descubre un lugar habitado?</h1><p>Mucho antes de que los mapas europeos representaran la península, pueblos originarios vivían y conocían estas tierras. Entre los pueblos históricos de Baja California Sur estuvieron los pericúes y guaycuras; en otras zonas de la península, los cochimíes.</p><p>Una expedición puede descubrir algo nuevo para sus viajeros sin que sea nuevo para quienes ya viven allí. ¿Quién tiene derecho a contar la historia de un lugar?</p><p class="caption">No atribuimos relatos inventados a comunidades reales. Esta escena propone una pregunta histórica, no una leyenda indígena.</p><div class="choices"><button onclick="openThing(\'map\')"><strong>Reexaminar el mapa</strong><span>¿Qué nombres aparecen? ¿Cuáles faltan?</span></button><button onclick="openThing(\'door\')"><strong>Salir a la noche</strong><span>La investigación puede continuar fuera.</span></button></div>';
if(s.overlay==="door")return back+'<div class="chapter">Umbral · Continuará</div><h1>Fuera hay otro misterio</h1><p>La brisa huele a sal. Bajo las estrellas, la costa se pierde en la oscuridad. El mapa sigue sobre la mesa; todavía no has descubierto por qué alguien insistió en dibujar una isla.</p><p>Esta es la frontera de nuestra primera escena. Puedes regresar y seguir cualquier pista. No hay un final obligatorio.</p><button class="primary" onclick="closeThing()">Regresar a la habitación</button>';
return back;
}
function render(){
if(!s.started){document.getElementById("app").innerHTML='<div class="intro"><div class="chapter">EXPLORANDUM · Primera expedición</div><h1>El mapa<br>imposible.</h1><p>Una noche. Un mapa antiguo. Un error que atravesó siglos. Entra cuando quieras. Sal cuando quieras. El misterio seguirá aquí.</p><button class="primary" onclick="begin()">Abrir la puerta →</button><p style="font-size:13px;margin-top:35px">Sin reloj · Sin preguntas obligatorias · Sin puntuaciones</p></div>';return}
const lines=["Hay una luz encendida. Sobre la mesa, un mapa que no debería existir.","Alguien ha estado investigando antes que tú. La tinta todavía parece reciente.","La habitación guarda varias pistas. No hay un orden correcto para descubrirlas."];
document.getElementById("app").innerHTML='<div class="world"><div class="bar"><div><div class="logo">EXPLORANDUM</div><div class="chapter">El mapa imposible · Escena 01</div></div><div><button onclick="openThing(\'guide\')">'+(s.guide?"Cambiar acompañante":"¿Quién te acompaña?")+'</button> <button onclick="next()">Otra mirada ↻</button></div></div><div class="viewport">'+room+'<button aria-label="Examinar el mapa sobre la mesa" title="Examinar el mapa" class="hotspot spot-map" onclick="openThing(\'map\')"></button><button aria-label="Mirar por la ventana" title="Mirar por la ventana" class="hotspot spot-window" onclick="openThing(\'window\')"></button><button aria-label="Examinar la vitrina" title="Examinar la vitrina" class="hotspot spot-case" onclick="openThing(\'case\')"></button><button aria-label="Abrir la puerta" title="Abrir la puerta" class="hotspot spot-door" onclick="openThing(\'door\')"></button><div class="narrative"><div class="line">'+lines[s.moment]+'</div><div class="hint">Toca los destellos para investigar · Puedes explorar en cualquier orden</div></div>'+(s.overlay?'<div class="overlay"><div class="sheet">'+overlay()+'</div></div>':'')+'</div><div class="bottom"><p>✧ Mapa · Ventana · Vitrina · Puerta<br>Hallazgos visitados: '+s.seen.filter(x=>x!=="guide").length+' · Guardado en este dispositivo</p><button onclick="openThing(\'map\')">Examinar el mapa →</button></div><div class="foot">Prototipo de una única escena: ilustración vectorial, no escena 3D ni película animada. Los personajes todavía son voces narrativas, no figuras animadas. La documentación histórica se distingue de la ficción. El progreso no se sincroniza entre dispositivos.</div></div>';
}
render();
</script></body></html>
