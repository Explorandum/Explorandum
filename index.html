<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12313b"><title>EXPLORANDUM · Expedición Baja</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:#203139;font:17px/1.6 system-ui,-apple-system,sans-serif}main{max-width:740px;margin:auto;padding:24px 18px 70px}header{padding:14px 0 30px;border-bottom:1px solid #b9c2be}.brand{font:700 28px Georgia,serif;letter-spacing:.05em}.motto,.muted{font-size:13px;color:#536b70}.eyebrow{color:#35636c;font-size:13px;letter-spacing:.12em;text-transform:uppercase}h1,h2{font-family:Georgia,serif;line-height:1.13}h1{font-size:clamp(39px,9vw,62px)}h2{font-size:clamp(28px,7vw,40px)}.panel{background:#f8f7f2;border:1px solid #bdc8c5;border-radius:8px;padding:23px;margin:25px 0}.choice{display:block;width:100%;text-align:left;background:#ffffff;border:1px solid #9eb2b1;color:#203139;border-radius:6px;margin:12px 0;padding:16px;font:inherit;cursor:pointer;min-height:54px}.choice:hover,.choice:focus-visible{background:#d9e7e5}.btn{background:#254f5b;color:#fff;border:0;border-radius:5px;padding:15px 20px;font:700 16px system-ui;margin:12px 9px 0 0;cursor:pointer}.secondary{background:#dce6e4;color:#23424a}.progress{height:7px;background:#c8d5d2;border-radius:20px;margin:22px 0}.progress div{height:100%;background:#467b79;border-radius:20px}.feedback{border-left:4px solid #467b79;background:#e9efeb;padding:14px;margin-top:18px}.map{display:block;width:100%;max-height:220px;border-radius:16px;margin:22px 0;background:#123844}textarea{width:100%;min-height:150px;background:#ffffff;border:1px solid #9aafaa;color:#203139;border-radius:10px;padding:14px;font:16px/1.5 system-ui}footer{border-top:1px solid #b9c2be;padding-top:20px;color:#b8cbc6;font-size:12px}
.real-map{margin:24px 0;border:1px solid #9bada9;overflow:hidden;background:#e7ebe6}.real-map iframe{display:block;width:100%;height:340px;border:0}.map-caption{font-size:12px;line-height:1.6;padding:10px 12px;color:#334d55}.map-caption a{color:#1b586b}.feedback p{margin:9px 0 0}.hint{color:#cbd9d5;font-size:14px;margin-top:12px}button:focus-visible{outline:3px solid #e6e8ae;outline-offset:2px}.nav{display:flex;gap:10px;margin:18px 0 10px}.nav button{border:1px solid #c7d8e2;background:#fff;color:#17405b;padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer}.sat-wrap{margin:25px 0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 12px 32px #172a3526;border:1px solid #d4dfe4}.sat-label{background:#153e5a;color:#fff;padding:13px 16px;font-size:12px;font-weight:800;letter-spacing:.11em}#satellite-map{height:clamp(330px,65vw,470px);width:100%;background:#acc7d5;z-index:0}.sat-tip{padding:13px 17px 0;margin:0;font-size:14px;color:#36556b}.sat-link{display:block;padding:12px 17px 17px;color:#125c98;font-size:14px;font-weight:700}.map-error{padding:30px}.panel{box-shadow:0 8px 24px #173b5120}.choice{border-radius:13px;border-color:#a8c8d9;clear:both}.panel>.btn{display:block;margin:12px 0 22px}.panel>.choice{margin:12px 0}.choice:hover,.choice:focus-visible{background:#dff2fb}.btn{border-radius:12px;background:#146ca1}.eyebrow{color:#116ba0}body{background:linear-gradient(155deg,#d9f0ff 0%,#f9f6e9 55%,#f1e3ce 100%)}header{border-color:#b4d3e3}.brand{color:#124d78}.progress div{background:#1c8cb9}.feedback{border-left-color:#1c8cb9;background:#e6f5fb}.sat-wrap{border:0;border-radius:24px;box-shadow:0 20px 55px #06284e44;background:#fff}.sat-label{background:linear-gradient(100deg,#ff6b42,#f6a835);color:#122b50;font-weight:900;letter-spacing:.12em}#satellite-map{height:auto;background:#102e49}#satellite-map iframe{display:block;width:100%;height:420px;border:0;background:#103b5c}.map-alternative{background:#e7f5ff;padding:12px 18px;text-align:center}.map-alternative a{color:#095da0;font-weight:800}.sat-tip{color:#163b5b}.sat-link{background:#103d69;color:white;padding:18px;font-size:16px;text-align:center;text-decoration:none}body{background:linear-gradient(145deg,#bfeeff 0%,#f6fbff 35%,#ffe7bb 75%,#ffcb9d 100%);color:#102c4b}.brand{color:#053b73;font-family:system-ui,sans-serif;font-size:clamp(30px,7vw,46px);font-weight:950;letter-spacing:.025em}.motto{color:#215d83;font-weight:650}.eyebrow{color:#e75a31;font-weight:900}.panel{border:2px solid #d2e6f5;border-radius:24px;background:#ffffffed;box-shadow:0 14px 30px #0e3c6830}.choice{background:#effaff;border:2px solid #a2d6ef;border-radius:16px;font-weight:650;color:#103b5c}.choice:hover,.choice:focus-visible{background:#bfeaff}.btn{background:#ff6945;color:#fff;border-radius:14px;box-shadow:0 5px 0 #b83e27}.secondary{background:#12669a;box-shadow:0 5px 0 #09436c;color:white}.progress div{background:#ff7148}.feedback{background:#e5f7ff;border-left:5px solid #ff7148;border-radius:10px}h1{color:#0b4270}h2{color:#124e79}.nav button{border:2px solid #8ccde9;border-radius:14px;background:white}.hint{color:#305d79}</style></head><body><main><header><div class="brand">EXPLORANDUM</div><div class="motto">Descubrir. Comprender. Estudiar.</div></header><div id="app"></div><footer>Expedición Baja · Los avances se guardan solo en este navegador, sin cuentas ni datos personales.</footer></main>
<script>
"use strict";
const app=document.getElementById("app"),key="explorandum-baja-mision-02";
let state={route:null,step:0,answers:{},done:false};
try{const s=JSON.parse(localStorage.getItem(key));if(s&&["campo","analisis"].includes(s.route))state=s}catch(e){}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const map='<svg class="map" viewBox="0 0 420 200" role="img" aria-label="Esquema simplificado de la península y el golfo de California; no está a escala"><rect width="420" height="200" rx="15" fill="#143845"/><path d="M170 0L195 20 204 52 211 84 227 111 231 145 248 181 236 190 213 156 190 125 178 90 167 45Z" fill="#cfbb91"/><path d="M246 0H420V200H284L267 169 251 125 234 84 230 40Z" fill="#859873"/><path d="M226 10L220 50 232 96 248 138 270 188" stroke="#95d7de" stroke-width="3" stroke-dasharray="6 6" fill="none"/><g fill="#fff" font-size="13"><text x="27" y="91">Océano</text><text x="27" y="109">Pacífico</text><text x="285" y="80">Continente</text><text x="245" y="25" font-size="11">Golfo de</text><text x="245" y="39" font-size="11">California</text></g></svg>';
let homeView=true,leafletMap=null;
function goHome(){homeView=true;render();window.scrollTo(0,0)}
function resume(){homeView=false;render();window.scrollTo(0,0)}
function goBack(){if(state.done){state.done=false;state.step=questions[state.route].length-1}else if(state.step>0){state.step--}else{homeView=true}save();render();window.scrollTo(0,0)}
function initSatellite(){const el=document.getElementById("satellite-map");if(!el)return;el.innerHTML='<iframe title="Explorador satelital de Baja California" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=27.6,-111.4&t=k&z=7&output=embed"></iframe><div class="map-alternative"><a href="https://www.google.com/maps/@27.6,-111.4,7z/data=!3m1!1e3" target="_blank" rel="noopener">Abrir mapa satelital interactivo ↗</a></div>'}
const nav='<nav class="nav"><button type="button" onclick="goHome()">⌂ Inicio</button><button type="button" onclick="goBack()">← Atrás</button></nav>';
const realMap="<section class=\"sat-wrap\"><div class=\"sat-label\">EXPEDICIÓN 01 / VISTA DESDE EL ESPACIO</div><div id=\"satellite-map\" aria-label=\"Explorador satelital de Baja California\"></div><p class=\"sat-tip\">Explora el golfo y sus montañas. Si el mapa integrado no aparece, abre el mapa satelital en otra pestaña.</p><a class=\"sat-link\" href=\"https://worldview.earthdata.nasa.gov/?v=-117,21,-105,33\" target=\"_blank\" rel=\"noopener\">☁ Explorar nubes e imágenes reales en NASA Worldview ↗</a></section>";
const questions={
campo:[
{title:"La pregunta de un geólogo",intro:"Observa el mapa satelital: localiza la península de Baja California, el continente y el mar entre ambos. ¿Cuál de estas frases describe una observación y no una explicación?",options:["Entre la península y el continente hay una franja de mar","Un terremoto abrió el golfo en un día","Las olas separaron la península del continente"],right:0,explain:"Primero describimos lo observable. La causa necesita otras pruebas.",reflection:"Escribe dos observaciones del mapa y una pregunta que no puedas resolver mirándolo."},
{title:"Una distancia que hay que estimar",intro:"En el mapa, acerca la zona de La Paz y después la de Loreto. Para practicar unidades, imagina una ruta que mide 240 km. ¿Cuántos metros son? La cifra es un supuesto didáctico, NO la distancia entre esas ciudades.",options:["240.000 metros","24.000 metros","2.400 metros"],right:0,explain:"1 km = 1.000 m; por tanto, 240 × 1.000 = 240.000 m.",reflection:"¿Cómo comprobarías la distancia real entre dos puntos usando la herramienta de medir de Google Maps? Indica los puntos que elegirías."},
{title:"Un movimiento casi invisible",intro:"Modelo hipotético: dos bloques se separan 3 cm cada año. ¿Cuánto acumulan en 250 años? No es una velocidad medida en el golfo.",options:["7,5 metros","75 metros","750 metros"],right:0,explain:"3 × 250 = 750 cm. Como 100 cm = 1 m, son 7,5 m.",reflection:"Escribe las operaciones y explica por qué importa indicar las unidades."},
{title:"¿Y durante muchísimo tiempo?",intro:"Si el mismo movimiento hipotético de 3 cm/año se mantuviera 1.000.000 de años, ¿qué distancia resultaría? La velocidad real puede cambiar con el tiempo.",options:["30 kilómetros","3 kilómetros","300 kilómetros"],right:0,explain:"3.000.000 cm = 30.000 m = 30 km. Es una extrapolación matemática, no una reconstrucción geológica.",reflection:"¿Por qué sería un error afirmar que el golfo se abrió exactamente esa distancia?"},
{title:"Rocas que cuentan historias",intro:"Unas capas de roca aparecen inclinadas junto a una montaña. ¿Cuál es la conclusión científicamente más prudente?",options:["Las capas pueden haberse deformado; necesitamos más datos","Seguro que las inclinó un único terremoto","Todas las rocas inclinadas son volcánicas"],right:0,explain:"La inclinación es una observación. La causa requiere estudiar la roca, las capas y el entorno.",reflection:"¿Qué diferencias esperarías entre capas de sedimentos y una roca formada al enfriarse magma? Si no lo sabes, formula una pregunta investigable."},
{title:"Un mar lleno de vida",intro:"El golfo de California reúne ambientes marinos muy distintos. ¿Qué dato ayudaría más a explicar por qué algunas especies aparecen en unas zonas y no en otras?",options:["Temperatura, profundidad, alimento y tipo de hábitat","Solo el color del agua en una fotografía","El número de turistas de una playa"],right:0,explain:"La distribución de especies depende de factores ambientales y relaciones ecológicas; una fotografía no basta.",reflection:"Elige un animal marino y propone qué alimento, refugio o condiciones necesitaría. Distingue lo que sabes de lo que supones."},
{title:"Una cadena alimentaria",intro:"En un modelo simplificado: el fitoplancton utiliza luz y nutrientes; pequeños animales lo consumen; peces mayores comen a esos animales. Si disminuye mucho el fitoplancton, ¿qué podría ocurrir?",options:["Podría disminuir el alimento disponible para varios niveles de la cadena","Todos los peces crecerían automáticamente más","No cambiaría nada porque el mar es muy grande"],right:0,explain:"Una alteración en la base de la red alimentaria puede afectar a otros organismos, aunque el resultado real depende de muchas relaciones.",reflection:"Dibuja en papel una cadena de tres niveles y explica con palabras qué significan las flechas."},
{title:"La evidencia frente a la historia",intro:"Alguien afirma: «El golfo se formó por un solo terremoto». ¿Qué prueba sería más útil para evaluar esa explicación?",options:["Estudiar fallas, edades de rocas y movimientos tectónicos a lo largo del tiempo","Preguntar cuál es la playa más bonita","Mirar una sola fotografía aérea"],right:0,explain:"Los procesos de formación del golfo ocurrieron durante millones de años y requieren evidencias geológicas diversas.",reflection:"¿Qué diferencia hay entre una hipótesis y una prueba? Pon un ejemplo del golfo."},
{title:"Cuaderno científico: tu explicación",intro:"Has observado el mapa, trabajado con unidades, estudiado rocas y explorado relaciones entre organismos. Ahora construye tu propia explicación.",write:"Redacta al menos seis frases: (1) dos observaciones, (2) cómo pudo formarse el golfo, (3) una prueba que buscarías, (4) una operación con unidades y (5) una pregunta nueva. No necesitas saberlo todo: señala lo que es una hipótesis."}
],
analisis:[
{title:"Hipótesis y evidencia",intro:"La forma del golfo sugiere una separación tectónica. ¿Qué pruebas contrastarían mejor esa hipótesis?",options:["Correspondencias geológicas, edades de rocas y mediciones del movimiento de placas","Únicamente el parecido visual entre las costas","La salinidad del agua"],right:0,explain:"Varias evidencias independientes permiten comprobar una hipótesis con más rigor.",reflection:"¿En qué se diferencia una coincidencia de una relación causal?"},
{title:"Escalas de tiempo",intro:"Cálculo hipotético: si dos bloques se separasen 45 milímetros al año durante 2 millones de años, ¿qué desplazamiento acumularían? No es una reconstrucción real del golfo.",options:["90 kilómetros","9 kilómetros","900 kilómetros"],right:0,explain:"45 × 2.000.000 = 90.000.000 milímetros = 90 kilómetros.",reflection:"¿Por qué es arriesgado extrapolar una velocidad actual a millones de años?"},
{title:"Construir un modelo",intro:"El golfo está relacionado con fallas, extensión y movimientos relativos entre placas. ¿Qué explicación resulta más convincente?",options:["Una evolución tectónica compleja respaldada por varias evidencias","Un único terremoto instantáneo","Exclusivamente la erosión del oleaje"],right:0,explain:"Un buen modelo debe explicar las observaciones, los procesos y las escalas temporales.",reflection:"¿Qué observaciones distinguirían la erosión marina de la deformación tectónica?"},
{title:"Dictamen científico",intro:"Un titular afirma: «La forma de Baja California demuestra que el continente se partió en dos». Evalúa críticamente esa afirmación.",write:"Redacta 4–6 frases: observación, hipótesis, dos tipos de pruebas, una limitación y conclusión provisional."}
]};
function begin(route){homeView=false;state={route,step:0,answers:{},done:false};save();render()}
function select(i){state.answers["a"+state.step]=i;save();render()}
function saveReflection(){const e=document.getElementById("reflection");if(e){state.answers["r"+state.step]=e.value;save();const n=document.getElementById("saved-reflection");if(n)n.textContent="Guardado en tu cuaderno de este dispositivo."}}
function next(){saveReflection();homeView=false;state.step++;save();render();scrollTo(0,0)}
function finish(){const t=document.getElementById("answer").value.trim();if(!t){document.getElementById("notice").textContent="Escribe primero tu explicación.";return}state.answers["t"+state.step]=t;if(state.route==="campo"&&t.split(/\s+/).length<45){document.getElementById("notice").textContent="Desarrolla un poco más la explicación: al menos unas 45 palabras. No se evalúa automáticamente su calidad.";return}state.done=true;save();render();scrollTo(0,0)}
function reset(){if(confirm("¿Empezar otra vez? Se borrará el progreso de este dispositivo.")){state={route:null,step:0,answers:{},done:false};homeView=true;save();render()}}
function copy(){const q=questions[state.route];const t=q.map((x,i)=>(i+1)+". "+x.title+"\n"+(x.write?(state.answers["t"+i]||""):(x.options[state.answers["a"+i]]||"Sin responder"))).join("\n\n");if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Cuaderno copiado")).catch(()=>prompt("Copia tu cuaderno:",t));else prompt("Copia tu cuaderno:",t)}
function render(){
if(!state.route||homeView){app.innerHTML='<div class="eyebrow" style="margin-top:32px">Primera expedición · Baja California</div><h1>El mar que nació de una fractura</h1><p>¿Cómo puede surgir un mar entre una península y un continente? Investiga con preguntas, pruebas, cálculos y tus propias conclusiones.</p>'+realMap+'<section class="panel"><h2>Elige tu ruta</h2><p>Dos recorridos independientes. Sin notas ni cronómetro.</p>'+(state.route?'<button class="btn" onclick="resume()">Continuar mi expedición →</button>':'')+'<button class="choice" onclick="begin(\'campo\')">Ruta de campo · 11+ años</button><button class="choice" onclick="begin(\'analisis\')">Ruta de análisis · 14+ años</button><p class="muted">Cada teléfono conserva su propio avance.</p></section><p class="muted">Ruta de campo ampliada: observación, medidas, geología, ecosistemas y cuaderno de investigación. Una expedición no sustituye la evaluación completa de Year 7.</p>';initSatellite();return}
const qs=questions[state.route],label=state.route==="campo"?"Ruta de campo":"Ruta de análisis";
if(state.done){app.innerHTML=nav+'<div class="eyebrow" style="margin-top:32px">Primera investigación · recorrido terminado</div><h1>Primera investigación realizada</h1><p>La formación del golfo de California está relacionada con procesos tectónicos prolongados. Una forma en el mapa plantea preguntas; las evidencias geológicas permiten comprobar hipótesis.</p><section class="panel"><h2>Tu siguiente investigación</h2><p>Observa una roca o una montaña. Distingue lo que ves de lo que supones. ¿Qué pruebas te ayudarían a conocer su historia? Tu recorrido ha terminado, pero eso no certifica todavía el dominio de los objetivos curriculares.</p><button class="btn" onclick="copy()">Copiar mi cuaderno</button><button class="btn secondary" onclick="reset()">Empezar otra ruta</button></section>';initSatellite();return}
const q=qs[state.step],a=state.answers["a"+state.step];let h=nav+'<div class="eyebrow" style="margin-top:32px">Expedición Baja · '+label+'</div><div class="progress"><div style="width:'+(state.step/qs.length*100)+'%"></div></div><p class="muted">Etapa '+(state.step+1)+' de '+qs.length+'</p><h2>'+escapeHTML(q.title)+'</h2>'+realMap+'<section class="panel"><p>'+escapeHTML(q.intro)+'</p>';
if(q.write){h+='<label for="answer">'+escapeHTML(q.write)+'</label><textarea id="answer" placeholder="Escribe tu explicación...">'+escapeHTML(state.answers["t"+state.step]||"")+'</textarea><p class="muted" id="notice"></p><button class="btn" onclick="finish()">Terminar la misión</button>'}
else{q.options.forEach((o,i)=>h+='<button class="choice" onclick="select('+i+')">'+String.fromCharCode(65+i)+'. '+escapeHTML(o)+'</button>');if(a!==undefined){h+='<div class="feedback">'+(a===q.right?'<strong>Bien razonado.</strong> ':'<strong>Vuelve a examinar la evidencia.</strong> ')+(a===q.right?escapeHTML(q.explain)+'<p><strong>Para investigar y escribir:</strong> '+escapeHTML(q.reflection)+'</p><textarea id="reflection" aria-label="Tu reflexión científica" placeholder="Escribe tu razonamiento aquí..." oninput="saveReflection()">'+escapeHTML(state.answers["r"+state.step]||"")+'</textarea><p class="muted" id="saved-reflection">Tus ideas se guardan en este dispositivo. No hay corrección automática.</p>':'<p>Revisa tu procedimiento y prueba otra opción. No necesitas acertar a la primera.</p><details class="hint"><summary>¿Necesitas una pista?</summary><p>'+escapeHTML(state.step===1?(state.route==='campo'?'Piensa primero cuántos centímetros hay en un metro. Después multiplica los centímetros por año por el número de años.':'Convierte primero los milímetros a metros y después a kilómetros. Comprueba cada unidad.'):'Distingue lo que observas de lo que puedes demostrar. ¿Qué prueba apoyaría realmente esa afirmación?')+'</p></details>')+'</div>';if(a===q.right)h+='<button class="btn" onclick="next()">Continuar →</button>'}}
app.innerHTML=h+'</section><p class="muted">Tu progreso se guarda en este dispositivo.</p>';initSatellite()
}
render();
</script></body></html>
